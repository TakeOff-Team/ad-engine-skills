<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  ad-engine / render / annotated-hero.html
  FORMAT 9 — Annotated hero. "Made at a desk by a person": a grid-paper ground, one keyword that gets the treatment
  (display face + a hand-drawn scribble underline in the brand colour), and a REAL object floating with a soft shadow —
  a screenshot, a file card, a fan of real creatives — with optional desk annotations: a sticky note, a hand-drawn arrow,
  a flourish mark, the founder cut out and pointing. Built 2026-09-14 from Remy Gaskell's YouTube thumbnail grammar
  (taste.md, The AI Course) — the first template whose look came from the brand's own references instead of a stock layout.
  Canvas: 1080×1350 default; 1:1 and 9:16 flex the object area.

  TASTE RULE baked in: exactly ONE keyword wrapped in <em> gets the accent + scribble. Zero or two+ is flagged.
  HARD RULE: the object is real (a capture, a photo, the brand's own authored card) — never a generated dashboard.

  SLOTS
    headline       required. Casual, lowercase reads best. Wrap ONE keyword/phrase in <em>. Auto-fits.
    subhead        (optional) one line of context under the headline, plain sans — the operator asked for it on the 09-14 batch ("more context about the AI system")
    headline-face  (optional) "display" (default — whole line in the display face, like "the ultimate setup")
                   | "body" (plain sans, only the <em> keyword in the display face — like "control room for skills")
    object         (img, optional*) the hero object: screenshot / photo / real creative. Rendered as a floating card.
    object-html    (HTML, optional*) an AUTHORED object instead of an image — a file card, a stack of cards, a mini list.
                   *one of object / object-html should be present; the template warns when both are empty.
    object-rotate  (optional) degrees, e.g. "-3" (default -2.5)
    object-width   (optional) CSS width of the card, default "86%"
    note           (optional) sticky-note text — short: "91 skills" / "reads the vault"
    note-pos       (optional) tr | br (default) | bl | tl
    arrow          (optional) "" none | "on" — a hand-drawn arrow from the headline toward the object
    mark           (optional) "" none | "asterisk" — an accent flourish top-right
    founder        (img, optional) a CUTOUT PNG (transparent background) of the founder, bottom-right, in front of the object
    founder-height (optional) e.g. "46%" of canvas height (default)
    cta            (optional) pill, bottom-RIGHT by default (rev-2); cta-pos: "left" to keep it left
    disclaimer     (optional)
    theme          (optional) "" dots (default) | "lines" | "plain" | "ink"
    brand-name / logo   injected from spec.brand
-->
<style>
  :root{ --brand-primary:#173EF5; --brand-accent:#FFB800; --brand-ink:#111111; --brand-paper:#FFFFFF; --brand-muted:#6B6B73;
         --font-display:Inter,system-ui,sans-serif; --font-body:Inter,system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{background-color:var(--brand-paper);color:var(--brand-ink);font-family:var(--font-body);position:relative;
       background-image:radial-gradient(circle, color-mix(in srgb,var(--brand-ink) 14%,transparent) 1.4px, transparent 1.6px);background-size:36px 36px;background-position:18px 18px}
  body.theme-lines{background-image:linear-gradient(color-mix(in srgb,var(--brand-ink) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--brand-ink) 7%,transparent) 1px,transparent 1px);background-size:44px 44px}
  body.theme-plain{background-image:none}
  body.theme-ink{background-color:var(--brand-ink);color:#fff;background-image:radial-gradient(circle, rgba(255,255,255,.16) 1.4px, transparent 1.6px)}

  .frame{position:relative;z-index:1;height:100%;padding:60px 64px 56px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:60px}
  .brand{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:800;font-size:28px}
  .brand img{height:52px;width:auto;max-width:260px}
  .brand img[src=""],.brand img:not([src]){display:none}
  .mark{width:110px;height:110px;position:absolute;right:56px;top:150px;display:none;color:var(--brand-accent)}
  body.mark-asterisk .mark{display:block}

  .headline-box{height:min(33vh,470px);margin-top:28px;display:flex;align-items:flex-end;position:relative;flex-shrink:0}
  .headline{font-family:var(--font-display);font-weight:900;font-size:calc(150px * var(--display-scale,1));line-height:var(--display-lh,.98);letter-spacing:-.03em;width:100%;text-wrap:balance;position:relative;z-index:2}
  .headline em{font-style:normal;color:var(--brand-primary-text,var(--brand-primary));font-family:var(--font-display)}
  body.theme-ink .headline em{color:var(--brand-accent-on-ink,var(--brand-accent))}
  body.face-body .headline{font-family:var(--font-body);font-weight:800;letter-spacing:-.035em;font-size:128px;line-height:1.02}
  body.face-body .headline em{font-family:var(--font-display);font-weight:900;font-size:calc(1em * var(--display-scale,1))}
  .scribbles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
  .scribbles path{fill:none;stroke:var(--brand-primary);stroke-linecap:round;stroke-linejoin:round}
  body.theme-ink .scribbles path{stroke:var(--brand-accent-on-ink,var(--brand-accent))}

  .subhead{margin-top:22px;font-family:var(--font-body);font-weight:500;font-size:42px;line-height:1.22;letter-spacing:-.015em;color:var(--brand-ink);opacity:.86;max-width:94%;flex-shrink:0}
  /* rev-2 lessons (The AI Course, 2026-09-14): the scribble sat on the subhead on 6/6 cards — with a subhead the headline box is content-height (everything moves up),
     the headline steps down one size to make room, and the subhead clears the scribble's depth */
  body.has-subhead .headline-box{height:auto;min-height:0;align-items:flex-start;margin-top:36px}
  body.has-subhead .headline{font-size:calc(132px * var(--display-scale,1))}
  body.has-subhead .subhead{margin-top:48px}
  body.has-subhead .stage{margin-top:30px}
  body.theme-ink .subhead{color:#fff}
  .stage{flex:1;min-height:0;position:relative;margin-top:36px}
  .object{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
  .card{width:86%;max-height:100%;transform:rotate(-2.5deg);border-radius:18px;overflow:hidden;box-shadow:0 34px 70px rgba(0,0,0,.20),0 6px 14px rgba(0,0,0,.08);border:1.5px solid color-mix(in srgb,var(--brand-ink) 12%,transparent);background:#fff}
  .card img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
  .card img[src=""],.card img:not([src]){display:none}
  .card.empty{display:none}
  .authored{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  /* authored object helpers — use inside object-html */
  .file-card{background:#fff;border-radius:22px;padding:40px 48px;box-shadow:0 30px 60px rgba(0,0,0,.16),0 4px 10px rgba(0,0,0,.06);border:1.5px solid rgba(0,0,0,.08);font-family:var(--font-display);font-weight:900;font-size:calc(72px * var(--display-scale,1));line-height:var(--display-lh,.96);letter-spacing:-.01em;color:var(--brand-ink);white-space:nowrap}
  .file-card small{display:block;font-family:var(--font-mono,var(--font-body));font-weight:600;font-size:24px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-muted);margin-top:14px}
  .file-card.body{font-family:var(--font-body);font-weight:700;font-size:44px;line-height:1.15;letter-spacing:-.02em;white-space:normal}
  .file-card.body small{text-transform:none;letter-spacing:0;font-family:var(--font-body);font-weight:500;font-size:24px}
  .founder-shift .authored{justify-content:flex-start;padding-left:2%}
  .stack{position:relative;width:78%;height:100%}
  .stack .file-card{position:absolute}
  .no-object{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:60px;color:var(--brand-muted);font-size:26px;font-weight:600;border:2px dashed color-mix(in srgb,var(--brand-ink) 25%,transparent);border-radius:24px}
  .stage.empty .no-object{display:flex}
  /* overlays reserve their own room — a sticky note or the founder never sits over the object's text (rev-1 lesson, 2026-09-14) */
  .stage.has-note-br .object,.stage.has-note-br .authored{right:150px;bottom:44px}
  .stage.has-note-bl .object,.stage.has-note-bl .authored{left:230px;bottom:70px}
  .stage.has-note-tr .object,.stage.has-note-tr .authored{right:150px;top:44px}
  .stage.has-note-tl .object,.stage.has-note-tl .authored{left:230px;top:70px}
  .stage.has-founder .object,.stage.has-founder .authored{right:42%}
  .stage.has-founder.has-note-br .authored,.stage.has-founder.has-note-br .object{right:36%;bottom:0}

  .note{position:absolute;right:10px;bottom:10px;transform:rotate(4deg);background:#FFE86B;color:#1a1a1a;padding:26px 30px;min-width:190px;max-width:300px;
        font-family:var(--font-body);font-weight:800;font-size:40px;line-height:1.05;text-align:center;box-shadow:0 18px 34px rgba(0,0,0,.18);z-index:4;letter-spacing:-.01em;text-wrap:balance}
  .note.tr{bottom:auto;top:6px;transform:rotate(-3deg)} .note.bl{right:auto;left:10px;transform:rotate(-4deg)} .note.tl{right:auto;left:10px;bottom:auto;top:6px;transform:rotate(3deg)}
  .arrow{position:absolute;left:8px;top:-34px;width:150px;height:110px;display:none;z-index:3}
  body.arrow-on .arrow{display:block}
  .arrow path{fill:none;stroke:var(--brand-primary);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .founder{position:absolute;right:-56px;bottom:-24px;height:92%;width:auto;z-index:5;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.22))}
  /* founder + CTA both on the right: the stage ends above the CTA row, so the cutout's base sits over the row's top edge, never on the button */
  body.has-founder .stage{margin-bottom:26px}
  .founder[src=""],.founder:not([src]){display:none}

  .bottom{flex-shrink:0;margin-top:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;position:relative;z-index:6}
  .cta{font-family:var(--font-display);font-weight:800;font-size:54px;padding:28px 52px;border-radius:999px;background:var(--brand-primary);color:var(--brand-on-primary,#fff);white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.14)}
  .bottom{flex-direction:row-reverse}            /* CTA bottom-right (operator, rev-2); disclaimer sits bottom-left */
  body.cta-left .bottom{flex-direction:row}
  .cta::after{content:" →"}
  .disclaimer{font-size:17px;color:var(--brand-muted);letter-spacing:.01em}
  body.theme-ink .disclaimer{color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 8v84M8 50h84M20 20l60 60M80 20L20 80"/></g></svg>
<div class="frame">
  <div class="top">
    <div class="brand"><img data-slot-src="logo" data-optional alt=""><span data-slot="brand-name" data-optional>Brand</span></div>
  </div>

  <div class="headline-box">
    <svg class="scribbles" id="scribbles" aria-hidden="true"></svg>
    <h1 class="headline" data-slot="headline" data-fit data-fit-min="56">the <em>ultimate</em> setup</h1>
  </div>
  <p class="subhead" data-slot="subhead" data-optional>one line of context under the headline.</p>

  <div class="stage" id="stage">
    <div class="object">
      <div class="card" id="card"><img data-slot-src="object" data-optional alt=""></div>
    </div>
    <div class="authored" data-slot="object-html" data-optional></div>
    <div class="no-object">no object — the hero is a real thing: a screenshot, a photo, a real creative, or an authored card in <code>object-html</code></div>
    <svg class="arrow" viewBox="0 0 150 110" aria-hidden="true"><path d="M6 12 C 40 4, 92 10, 118 62"/><path d="M96 54 L 120 66 L 124 40"/></svg>
    <div class="note br" id="note" data-slot="note" data-optional>91 skills</div>
    <img class="founder" data-slot-src="founder" data-optional alt="">
  </div>

  <div class="bottom">
    <div class="cta" data-slot="cta" data-optional>Start building</div>
    <div class="disclaimer" data-slot="disclaimer" data-optional></div>
  </div>
</div>
<span data-slot="theme" data-optional hidden></span>
<span data-slot="headline-face" data-optional hidden></span>
<span data-slot="object-rotate" data-optional hidden></span>
<span data-slot="object-width" data-optional hidden></span>
<span data-slot="note-pos" data-optional hidden></span>
<span data-slot="arrow" data-optional hidden></span>
<span data-slot="mark" data-optional hidden></span>
<span data-slot="founder-height" data-optional hidden></span>
<span data-slot="cta-pos" data-optional hidden></span>
<script>
  const slotText = n => ((document.querySelector(`[data-slot="${n}"]`)||{}).textContent || '').trim();
  const sync = () => {
    const theme = slotText('theme'); const face = slotText('headline-face'); const arrow = slotText('arrow'); const mark = slotText('mark');
    const sub = document.querySelector('[data-slot="subhead"]'); const hasSub = sub && getComputedStyle(sub).display !== 'none' && sub.textContent.trim();
    const cls = [theme ? 'theme-' + theme : '', face === 'body' ? 'face-body' : '', arrow && arrow !== 'off' ? 'arrow-on' : '', mark ? 'mark-' + mark : '', hasSub ? 'has-subhead' : '', slotText('cta-pos') === 'left' ? 'cta-left' : '', (document.querySelector('.founder')||{}).getAttribute && document.querySelector('.founder').getAttribute('src') ? 'has-founder' : ''].filter(Boolean).join(' ');
    if (document.body.className !== cls) document.body.className = cls;
    const card = document.getElementById('card'); const img = card.querySelector('img');
    const hasImg = !!(img && img.getAttribute('src')); card.classList.toggle('empty', !hasImg);
    const rot = slotText('object-rotate'); card.style.transform = `rotate(${rot !== '' ? parseFloat(rot) : -2.5}deg)`;
    const w = slotText('object-width'); if (w) card.style.width = w;
    const authored = document.querySelector('[data-slot="object-html"]'); const hasAuthored = authored && getComputedStyle(authored).display !== 'none' && authored.innerHTML.trim();
    document.getElementById('stage').classList.toggle('empty', !hasImg && !hasAuthored);
    const note = document.getElementById('note'); const pos = slotText('note-pos') || 'br'; note.className = 'note ' + pos;
    const stage = document.getElementById('stage'); stage.className = stage.className.replace(/\bhas-\S+/g, '').trim();
    if (getComputedStyle(note).display !== 'none') stage.classList.add('has-note-' + pos);
    const founder = document.querySelector('.founder'); if (founder && founder.getAttribute('src')) stage.classList.add('has-founder');
    const fh = slotText('founder-height'); const f = document.querySelector('.founder'); if (fh) f.style.height = fh;
  };
  // scribble underline: drawn AFTER fit settles, one stroke per rendered line of the <em> keyword (hand-drawn: two passes, slight wobble)
  const drawScribbles = () => {
    const svg = document.getElementById('scribbles'); svg.innerHTML = '';
    const box = document.querySelector('.headline-box').getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`); svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
    const h = document.querySelector('.headline'); const em = h.querySelector('em'); if (!em) return;
    const fs = parseFloat(getComputedStyle(em).fontSize); const sw = Math.max(5, fs * 0.055);
    let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280 - .5; };
    for (const r of em.getClientRects()) {
      const x0 = r.left - box.left - fs * .06, x1 = r.right - box.left + fs * .04; const y = r.bottom - box.top - fs * .02;
      const w = x1 - x0; const j = fs * .05;
      const p1 = `M${x0} ${y + rnd()*j} C ${x0 + w*.25} ${y - j*1.2 + rnd()*j}, ${x0 + w*.6} ${y + j*1.4 + rnd()*j}, ${x1} ${y + rnd()*j}`;
      const y2 = y + sw * 2.2; const x2 = x1 - w * .12, x3 = x0 + w * .35;
      const p2 = `M${x2} ${y2 + rnd()*j} C ${x2 - w*.2} ${y2 + j*1.5}, ${x3 + w*.1} ${y2 - j}, ${x3} ${y2 + j*.6}`;
      for (const [d, wdt] of [[p1, sw], [p2, sw * .8]]) { const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', d); path.setAttribute('stroke-width', wdt); svg.appendChild(path); }
    }
  };
  // an authored object taller than the stage (a long quote at 1:1) is centred and spills UP over the subhead/headline —
  // shrink its type until it fits, the way data-fit does for headlines (c06 at 1:1 and c01-r1, 2026-09-14)
  const fitAuthored = () => {
    const box = document.querySelector('.authored'); if (!box || getComputedStyle(box).display === 'none') return;
    const kid = box.firstElementChild; if (!kid) return;
    kid.style.fontSize = ''; kid.querySelectorAll('[style*="font-size"]').forEach(el => { if (!el.dataset.fs0) el.dataset.fs0 = getComputedStyle(el).fontSize; el.style.fontSize = el.dataset.fs0; });
    let guard = 0;
    const over = () => { const b = box.getBoundingClientRect(), k = kid.getBoundingClientRect(); return k.top < b.top - 2 || k.bottom > b.bottom + 2 || k.left < b.left - 2 || k.right > b.right + 2; };
    while (over() && guard++ < 24) {
      for (const el of [kid, ...kid.querySelectorAll('*')]) { const fs = parseFloat(getComputedStyle(el).fontSize); if (fs > 14) el.style.fontSize = (fs * 0.94) + 'px'; }
    }
  };
  window.__sync = sync; window.__afterFit = () => { fitAuthored(); drawScribbles(); }; sync(); fitAuthored(); drawScribbles();
  window.__qa = function(){
    const flags = [];
    const ems = document.querySelectorAll('.headline em').length;
    if (ems === 0) flags.push('TASTE: no <em> keyword in the headline — one keyword gets the treatment (pixel face + scribble); wrap it');
    if (ems > 1) flags.push(`TASTE: ${ems} <em> runs in the headline — the references give ONE keyword the treatment, not ${ems}`);
    { const box = document.querySelector('.authored'); const kid = box && box.firstElementChild; if (kid && getComputedStyle(box).display !== 'none') { const b = box.getBoundingClientRect(), k = kid.getBoundingClientRect(); if (k.top < b.top - 4 || k.bottom > b.bottom + 4) flags.push(`OVERFLOW: the authored object is ${Math.round(k.height - b.height)}px taller than its stage even after shrinking — cut the text or drop the subhead`); } }
    if (document.getElementById('stage').classList.contains('empty')) flags.push('NO OBJECT — the hero is a real thing (screenshot / photo / real creative / authored card); the stage is empty');
    const words = document.querySelector('.headline').textContent.trim().split(/\s+/).filter(Boolean).length;
    if (words > 6) flags.push(`headline is ${words} words — the references run 2–5; cut`);
    // overlays covering the object's text — the sticky note and the founder cutout sit above the stage; a note over a card's
    // last line shipped on the 2026-09-14 rev-1 batch (c01-r1, c02-r1, c06 at 1:1) because the generic visual QA only checks table cells
    const vis = el => el && getComputedStyle(el).display !== 'none' && el.getClientRects().length;
    const inter = (a, b) => Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)) * Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
    const textLeaves = [...document.querySelectorAll('.authored *')].filter(el => vis(el) && el.children.length === 0 && el.textContent.trim());
    const cardImg = document.querySelector('.card img'); if (cardImg && vis(cardImg)) textLeaves.push(cardImg);
    for (const [name, el] of [['sticky note', document.getElementById('note')], ['founder cutout', document.querySelector('.founder')]]) {
      if (!vis(el)) continue; const r = el.getBoundingClientRect();
      const hit = textLeaves.filter(t => inter(r, t.getBoundingClientRect()) > 400);
      if (hit.length) flags.push(`COLLISION: ${name} covers ${hit.length} text element(s) of the object ("${hit[0].textContent.trim().slice(0, 30)}…") — move note-pos / shrink the card / drop the note`);
    }
    { const sub = document.querySelector('.subhead'); const paths = [...document.querySelectorAll('.scribbles path')];
      if (sub && vis(sub) && paths.length) { const sr = sub.getBoundingClientRect(); const low = Math.max(...paths.map(p => p.getBoundingClientRect().bottom)); if (low > sr.top + 2) flags.push(`COLLISION: the scribble underline reaches ${Math.round(low - sr.top)}px into the subhead — shorten the headline or drop the subhead`); } }
    { const cta = document.querySelector('.cta'), fo = document.querySelector('.founder'); if (cta && vis(cta) && fo && vis(fo) && inter(cta.getBoundingClientRect(), fo.getBoundingClientRect()) > 400) flags.push('COLLISION: the CTA sits under the founder cutout — cta-pos: left, or raise the founder'); }
    const f = document.querySelector('.founder'); if (f && f.getAttribute('src') && f.naturalWidth && !/\.png$/i.test(f.getAttribute('src'))) flags.push('founder image is not a PNG — a cutout with a transparent background is expected; a rectangular photo will look pasted on');
    return flags;
  };
</script>
</body>
</html>

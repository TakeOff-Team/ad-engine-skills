<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  ad-engine / render / comparison-table.html
  FORMAT 5 — Comparison / data table. "Them vs us" or "before vs after" as a clean table.
  Canvas: 1080×1350 default; scales to 1:1 and 9:16 (table area flexes).

  HARD RULE: every cell containing a digit is a CLAIM. window.__qa() lists them all; each must trace
  to assets/references.md before the card ships. A table with no `source` line is flagged.

  SLOTS
    eyebrow      (optional) "Med school acceptance rates" / "Why clients switch"
    title        headline above the table — 3–8 words
    subtitle     (optional) one line under the title
    col-1 / col-2 / col-3   column headers; col-2 is the highlighted "us" column by default
    rows         HTML: one <tr> per row with three <td>s — <tr><td>Harvard</td><td>93.5%</td><td>3.5%</td></tr>
    highlight    (optional) which column to highlight: 1 | 2 | 3   (default 2)
    source       where the numbers come from — "Official 2025 admissions data; client results on file"
    disclaimer   (optional) compliance line — default provided
    cta          (optional)
    theme        (optional) "" paper | "ink"
    brand-name / logo  injected from spec.brand
-->
<style>
  :root{ --brand-primary:#173EF5; --brand-accent:#FFB800; --brand-ink:#111111; --brand-paper:#FFFFFF; --brand-muted:#6B6B73;
         --font-display:Inter,system-ui,sans-serif; --font-body:Inter,system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{background:var(--brand-paper);color:var(--brand-ink);font-family:var(--font-body)}
  body.theme-ink{background:var(--brand-ink);color:#fff}
  .frame{height:100%;padding:60px 64px 54px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:800;font-size:28px}
  .brand img{height:48px;width:auto;max-width:240px}
  .brand img[src=""],.brand img:not([src]){display:none}
  .eyebrow{font-family:var(--font-mono,var(--font-body));font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-primary-text,var(--brand-primary));
           padding:10px 16px;border-radius:999px;background:color-mix(in srgb,var(--brand-primary) 10%,transparent)}
  body.theme-ink .eyebrow{color:var(--brand-accent);background:rgba(255,255,255,.1)}
  .title{margin-top:40px;font-family:var(--font-display);font-weight:900;font-size:112px;line-height:var(--display-lh,1.02);letter-spacing:-.035em;text-wrap:balance}
  .subtitle{margin-top:16px;font-size:36px;line-height:1.3;color:var(--brand-muted);max-width:900px}
  body.theme-ink .subtitle{color:rgba(255,255,255,.7)}

  .table-wrap{flex:1;min-height:0;margin-top:40px;display:flex;flex-direction:column;justify-content:center}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:clamp(34px,3.6vh,52px);table-layout:fixed}
  thead th{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,2vh,27px);letter-spacing:.02em;text-align:left;padding:18px 22px;
           border-bottom:3px solid color-mix(in srgb,var(--brand-ink) 15%,transparent)}
  body.theme-ink thead th{border-color:rgba(255,255,255,.2)}
  thead th:first-child{width:36%}
  tbody td{padding:22px 22px;border-bottom:1.5px solid color-mix(in srgb,var(--brand-ink) 9%,transparent);font-weight:500;line-height:1.25;word-wrap:break-word}
  tbody td:not(:first-child){white-space:nowrap}
  body.theme-ink tbody td{border-color:rgba(255,255,255,.12)}
  tbody td:first-child{font-weight:700}
  /* highlighted column */
  .hl-2 th:nth-child(2),.hl-2 td:nth-child(2),.hl-1 th:nth-child(1),.hl-1 td:nth-child(1),.hl-3 th:nth-child(3),.hl-3 td:nth-child(3){
    background:color-mix(in srgb,var(--brand-primary) 9%,transparent);font-weight:800}
  .hl-2 th:nth-child(2),.hl-1 th:nth-child(1),.hl-3 th:nth-child(3){color:var(--brand-primary-text,var(--brand-primary));background:color-mix(in srgb,var(--brand-primary) 14%,transparent);border-radius:14px 14px 0 0}
  body.theme-ink .hl-2 th:nth-child(2),body.theme-ink .hl-1 th:nth-child(1),body.theme-ink .hl-3 th:nth-child(3){color:var(--brand-accent)}
  tbody tr:last-child td{border-bottom:none}
  .hl-2 tbody tr:last-child td:nth-child(2),.hl-1 tbody tr:last-child td:nth-child(1),.hl-3 tbody tr:last-child td:nth-child(3){border-radius:0 0 14px 14px}

  .bottom{flex-shrink:0;margin-top:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .source{font-size:19px;color:var(--brand-muted);line-height:1.35;max-width:640px}
  .disclaimer{font-size:17px;color:var(--brand-muted);margin-top:6px}
  body.theme-ink .source,body.theme-ink .disclaimer{color:rgba(255,255,255,.55)}
  .cta{font-family:var(--font-display);font-weight:800;font-size:26px;padding:20px 28px;border-radius:16px;background:var(--brand-primary);color:var(--brand-on-primary,#fff);white-space:nowrap}
  .cta::after{content:" →"}
  body.theme-ink .cta{background:var(--brand-accent);color:var(--brand-ink)}
.title em{font-style:normal;color:var(--brand-primary-text,var(--brand-primary))}
/* scale pass — The AI Course review 2026-09-13 */ .title{font-size:150px} .subtitle{font-size:48px;margin-top:22px} .cta{font-size:52px;padding:34px 56px;border-radius:22px}
tbody td{padding:18px 22px} .table-wrap{margin-top:28px}
/* display scale — brand.display_scale */ .title{font-size:calc(150px * var(--display-scale,1))}
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div class="brand"><img data-slot-src="logo" data-optional alt=""><span data-slot="brand-name" data-optional>Brand</span></div>
    <div class="eyebrow" data-slot="eyebrow" data-optional>Side by side</div>
  </div>
  <h1 class="title" data-slot="title" data-fit data-fit-min="44">What changes when you switch.</h1>
  <p class="subtitle" data-slot="subtitle" data-optional>One line of context under the title.</p>

  <div class="table-wrap">
    <table id="table" class="hl-2">
      <thead><tr><th data-slot="col-1">School</th><th data-slot="col-2">With us</th><th data-slot="col-3">Official rate</th></tr></thead>
      <tbody data-slot="rows"><tr><td>Harvard</td><td>Up to 93.5%</td><td>3.5%</td></tr><tr><td>Yale</td><td>Up to 93.5%</td><td>6.5%</td></tr><tr><td>Columbia</td><td>Up to 93.5%</td><td>1.7%</td></tr></tbody>
    </table>
  </div>

  <div class="bottom">
    <div>
      <div class="source" data-slot="source" data-optional>Source of every number in this table, with date</div>
      <div class="disclaimer" data-slot="disclaimer" data-optional>Individual results vary.</div>
    </div>
    <div class="cta" data-slot="cta" data-optional>See the full data</div>
  </div>
</div>
<span data-slot="theme" data-optional hidden></span>
<span data-slot="highlight" data-optional hidden></span>
<script>
  const sync = () => {
    const theme = ((document.querySelector('[data-slot="theme"]')||{}).textContent || '').trim();
    const cls = theme ? 'theme-' + theme : '';
    if (document.body.className !== cls) document.body.className = cls;
    const h = parseInt(((document.querySelector('[data-slot="highlight"]')||{}).textContent || '2').trim(), 10);
    const t = document.getElementById('table'); t.className = 'hl-' + ((h>=1 && h<=3) ? h : 2);
    // value cells stay on one line only when short; long text wraps instead of colliding with the next column
    t.querySelectorAll('tbody td:not(:first-child)').forEach(td => { td.style.whiteSpace = td.textContent.trim().length > 22 ? 'normal' : 'nowrap'; });
  };
  // table type is sized AFTER the title's fit has settled (render.js calls __afterFit) — sizing it inside __sync measured
  // leftover height while the title was still at its unfitted base size, and the table got stuck small (The AI Course c08)
  const fitTable = () => {
    const t = document.getElementById('table'); const wrap = document.querySelector('.table-wrap');
    t.style.fontSize = ''; t.querySelectorAll('td').forEach(td => td.style.padding = '');
    let size = parseFloat(getComputedStyle(t).fontSize); let guard = 0;
    while ((t.scrollHeight > wrap.clientHeight) && size > 20 && guard++ < 20) { size -= 1; t.style.fontSize = size + 'px'; t.querySelectorAll('td').forEach(td => td.style.padding = Math.max(10, 22 - (30-size)*1.5) + 'px 22px'); }
  };
  window.__sync = sync; window.__afterFit = fitTable; sync(); fitTable();
  window.__qa = function(){
    const flags = [];
    const claims = [...document.querySelectorAll('tbody td')].map(td => td.textContent.trim()).filter(t => /\d/.test(t));
    if (claims.length) flags.push(`CLAIM CHECK: ${claims.length} numeric cells (${claims.slice(0,6).join(' · ')}${claims.length>6?' …':''}) — every one must trace to assets/references.md before this ships.`);
    // read what is actually VISIBLE — an optional slot left empty is display:none with its placeholder text still in the DOM
    const srcEl = document.querySelector('[data-slot="source"]');
    const srcVisible = srcEl && getComputedStyle(srcEl).display !== 'none';
    const src = srcVisible ? (srcEl.textContent || '') : '';
    if (claims.length && (!src.trim() || /source of every number/i.test(src))) flags.push('NO SOURCE LINE — a comparison table with numbers and no stated source cannot ship.');
    const discEl = document.querySelector('[data-slot="disclaimer"]');
    const discVisible = discEl && getComputedStyle(discEl).display !== 'none' && discEl.textContent.trim();
    if (claims.length && !discVisible) flags.push('COMPLIANCE: numeric results with no disclaimer line — fill `disclaimer` ("Individual results vary.") unless the table compares features, not results.');
    const rows = document.querySelectorAll('tbody tr').length;
    if (rows > 6) flags.push(`${rows} rows — real comparison ads run 3–6; more than that stops being scannable`);
    return flags;
  };
</script>
</body>
</html>
